<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原型同步服务</title>
    <style>
        :root {
            --primary: #5B5EF4;
            --primary-dark: #3D40C4;
            --primary-light: #EEF0FF;
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #EF4444;
            --bg: #F3F4FB;
            --surface: #FFFFFF;
            --border: #E2E4EF;
            --text: #1A1D2E;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 2px 12px rgba(0,0,0,.08);
            --shadow-lg: 0 8px 32px rgba(0,0,0,.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tree, .project-card, .main-header, .projects-header, .status-text, .auth-subtitle, .form-row label, .auth-footer {
            user-select: none;
            -webkit-user-select: none;
        }

        /* ========== Auth Pages (login/register) ========== */
        .auth-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 32px 24px;
            width: 100%;
            max-width: 340px;
            margin: 12px;
        }

        .auth-card h2 {
            font-size: 20px; font-weight: 700;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-row { margin-bottom: 16px; }
        .form-row label {
            display: block;
            font-size: 13px; font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-row input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            color: var(--text);
            background: var(--bg);
            transition: 0.2s;
            outline: none;
        }

        .form-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91,94,244,.1);
            background: #fff;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px; font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }

        .btn-primary:hover { background: var(--primary-dark); }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--primary);
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
        }

        .auth-error {
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
            color: var(--danger);
            min-height: 20px;
        }

        .auth-error.success { color: var(--success); }

        /* ========== Main Page ========== */
        .main-wrapper {
            width: 100%;
            max-width: 860px;
            padding: 24px 20px 40px;
            align-self: flex-start;
        }

        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .main-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
            flex-shrink: 0;
        }

        .status-dot.error { background: var(--warning); animation: none; }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.4); }
        }

        .main-header-left h2 {
            font-size: 17px; font-weight: 700;
        }

        .main-header-left .status-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .main-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: var(--primary-light);
            border-radius: 20px;
            font-size: 13px; font-weight: 600;
            color: var(--primary);
        }

        .user-badge svg { width: 14px; height: 14px; }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
            border-radius: 20px;
            font-size: 13px; font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-logout:hover { box-shadow: 0 2px 8px rgba(239,68,68,.15); }

        .gear-icon { cursor:pointer; font-size:16px; opacity:.5; transition:.2s; vertical-align:middle; margin-left:4px; }
        .gear-icon:hover { opacity:1; color:var(--primary); }

        /* ========== Project List ========== */
        .projects-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .projects-header h3 {
            font-size: 16px; font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .projects-count {
            font-size: 12px; font-weight: 500;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .project-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
            margin-bottom: 10px;
            overflow: hidden;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .project-card:hover {
            border-color: #C7C9F0;
            box-shadow: var(--shadow);
        }

        .project-card-main {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            gap: 12px;
            user-select: none;
        }

        .project-icon {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--primary);
        }

        .project-info { flex: 1; min-width: 0; }
        .project-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .project-meta {
            display: flex; align-items: center; gap: 12px;
            margin-top: 3px; font-size: 12px; color: var(--text-secondary);
        }

        .project-meta span { display: flex; align-items: center; gap: 4px; }

        .project-actions {
            display: flex; align-items: center; gap: 2px;
            opacity: 0; transition: opacity 0.2s; flex-shrink: 0;
        }

        .project-card:hover .project-actions { opacity: 1; }

        .action-btn {
            display: flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; border-radius: 8px;
            border: 1px solid transparent;
            background: transparent; cursor: pointer;
            color: var(--text-secondary); transition: 0.2s;
        }

        .action-btn:hover { background: #f8fafc; border-color: var(--border); }
        .action-btn.upload-btn:hover { color: var(--primary); border-color: #C7C9F0; background: var(--primary-light); }
        .action-btn.delete-btn:hover { color: var(--danger); border-color: #fecaca; background: #fef2f2; }
        .action-btn svg { width: 16px; height: 16px; }

        .project-card-body {
            display: none;
            border-top: 1px solid var(--border);
            background: #fafafa;
            padding: 8px 16px 12px 56px;
        }

        .project-card.open .project-card-body { display: block; }

        .tree { list-style: none; padding-left: 16px; }
        .tree li { margin: 5px 0; position: relative; font-size: 13px; }
        .tree li::before {
            content: ''; position: absolute;
            left: -14px; top: 7px;
            width: 5px; height: 5px;
            border-radius: 50%; background: #cbd5e1;
        }

        .tree a {
            text-decoration: none; color: #334155;
            transition: color 0.2s;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .tree a:hover { color: var(--primary); }

        .folder {
            color: var(--text-secondary); font-weight: 600;
            margin-top: 8px;
            display: flex; align-items: center; gap: 4px;
        }

        .empty-state {
            text-align: center; padding: 48px 20px; color: var(--text-muted);
        }

        /* ========== Toast ========== */
        .toast {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            padding: 10px 24px; border-radius: 24px;
            font-size: 13px; font-weight: 600; z-index: 2000;
            animation: slideDown 0.3s; pointer-events: none;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .toast.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .toast.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .toast.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

        /* ========== Modal ========== */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(15,23,42,.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            animation: fadeIn .2s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 90%; max-width: 400px;
            animation: slideUp .25s;
        }

        .modal-header {
            padding: 20px 24px 0;
            display: flex; align-items: center; justify-content: space-between;
        }

        .modal-header h3 { font-size: 16px; font-weight: 700; }

        .modal-close {
            width: 28px; height: 28px; border-radius: 6px;
            border: none; background: #f1f5f9;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary); transition: .2s;
        }

        .modal-close:hover { background: #e2e8f0; }

        .modal-body { padding: 20px 24px; }
        .modal-body p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
        .modal-body select {
            width: 100%; padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px; color: var(--text);
            background: #f8fafc; outline: none; transition: .2s;
        }
        .modal-body select:focus { border-color: var(--primary); }

        .modal-footer {
            padding: 0 24px 20px;
            display: flex; gap: 10px; justify-content: flex-end;
        }

        .btn-cancel {
            padding: 8px 20px;
            background: #f1f5f9; color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 500; cursor: pointer; transition: .2s;
        }

        .btn-cancel:hover { background: #e2e8f0; }

        .btn-danger {
            padding: 8px 20px;
            background: var(--danger); color: #fff;
            border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600; cursor: pointer;
        }

        .btn-danger:hover { opacity: .9; }

        .btn-confirm {
            padding: 8px 20px;
            background: var(--primary); color: #fff;
            border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600; cursor: pointer;
        }

        .btn-confirm:hover { background: var(--primary-dark); }
    </style>
</head>
<body>

<!-- ==================== 登录页 ==================== -->
<div id="page-login" style="display:none;width:100%">
    <div class="auth-card" style="margin:0 auto">
        <h2>登录</h2>
        <p class="auth-subtitle">登录到原型同步服务</p>
        <div class="form-row">
            <label>用户名</label>
            <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username" />
        </div>
        <div class="form-row">
            <label>密码</label>
            <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <button class="btn-primary" onclick="doLogin()">登录</button>
        <div class="auth-error" id="login-error"></div>
        <div class="auth-footer">没有账号？<a href="#/register">立即注册</a></div>
    </div>
</div>

<!-- ==================== 注册页 ==================== -->
<div id="page-register" style="display:none;width:100%">
    <div class="auth-card" style="margin:0 auto">
        <h2>注册</h2>
        <p class="auth-subtitle">创建账号</p>
        <div class="form-row">
            <label>用户名</label>
            <input type="text" id="reg-username" placeholder="至少3位字符" autocomplete="off" />
        </div>
        <div class="form-row">
            <label>密码</label>
            <input type="password" id="reg-password" placeholder="至少6位字符" autocomplete="new-password" />
        </div>
        <div class="form-row">
            <label>确认密码</label>
            <input type="password" id="reg-password2" placeholder="再次输入密码" autocomplete="new-password" />
        </div>
        <button class="btn-primary" onclick="doRegister()">注册</button>
        <div class="auth-error" id="register-error"></div>
        <div class="auth-footer">已有账号？<a href="#/login">立即登录</a></div>
    </div>
</div>

<!-- ==================== 主页 ==================== -->
<div id="page-main" class="main-wrapper" style="display:none">
    <header class="main-header">
        <div class="main-header-left">
            <div class="status-dot" id="status-dot"></div>
            <div>
                <h2>同步服务 <span class="gear-icon" onclick="showConfigModal()" title="配置">&#9881;</span></h2>
                <div class="status-text" id="status-text">工作中</div>
            </div>
        </div>
        <div class="main-header-right">
            <div class="user-badge" id="user-badge"></div>
            <button class="btn-logout" onclick="doLogout()" title="注销">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="projects-header">
        <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            所有项目
            <span class="projects-count" id="projects-count">0</span>
        </h3>
    </div>

    <div id="project-list"></div>
    <div class="empty-state" id="empty-state" style="display:none">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <p>暂无缓存项目</p>
        <p style="font-size:12px;margin-top:4px;">在Axure中点击预览，项目将自动显示</p>
    </div>
</div>

<!-- 配置弹窗 -->
<div id="config-modal" class="modal-overlay" style="display:none" onclick="this.style.display='none'">
    <div class="modal" style="width:380px" onclick="event.stopPropagation()">
        <div class="modal-header"><h3>&#9881; 服务配置</h3><button onclick="document.getElementById('config-modal').style.display='none'" style="background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;font-size:18px">&times;</button></div>
        <div style="padding:16px 24px">
            <div class="form-row">
                <label>HTTP 服务端口</label>
                <input type="number" id="config-port" value="8080" min="1024" max="65535" style="width:100%">
                <div style="font-size:12px;color:var(--text-muted);margin-top:4px">修改后请重启程序以生效</div>
            </div>
            <div style="margin-top:16px;display:flex;justify-content:flex-end">
                <button class="btn btn-primary btn-sm" onclick="saveConfig()">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="ui.js"></script>
</body>
</html>
