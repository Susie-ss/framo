<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Framo Prototype Demo</title>
    <style>
      :root {
        --primary: #c85c3d;
        --ink: #231815;
        --muted: #6e625b;
        --line: rgba(35, 24, 21, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #fffdf8, #f3efe8);
      }

      .shell {
        display: grid;
        grid-template-columns: 240px 1fr;
        min-height: 100vh;
      }

      aside {
        border-right: 1px solid var(--line);
        padding: 24px;
        background: rgba(255, 255, 255, 0.7);
      }

      main {
        padding: 28px;
      }

      .brand {
        margin-bottom: 28px;
      }

      .menu {
        display: grid;
        gap: 10px;
      }

      .menu div,
      .card,
      .stat {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.8);
      }

      .menu div {
        padding: 12px 14px;
      }

      .hero {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 18px;
      }

      .hero h1,
      .card h3 {
        margin: 0;
      }

      .hero p {
        color: var(--muted);
      }

      button {
        border: 0;
        background: var(--primary);
        color: white;
        padding: 12px 16px;
        border-radius: 14px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .stat,
      .card {
        padding: 16px;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }

      .table th,
      .table td {
        text-align: left;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand">
          <strong>Framo Prototype</strong>
          <p>HTML 托管示例</p>
        </div>
        <div class="menu">
          <div>总览</div>
          <div>页面管理</div>
          <div>组件库</div>
          <div>版本记录</div>
        </div>
      </aside>

      <main>
        <div class="hero">
          <div>
            <h1>运营控制台</h1>
            <p>这是一个本地托管的原型 HTML，可被主应用通过 iframe 统一预览。</p>
          </div>
          <button>创建页面</button>
        </div>

        <section class="stats">
          <article class="stat">
            <div>今日访问</div>
            <strong>18,240</strong>
          </article>
          <article class="stat">
            <div>生成页面</div>
            <strong>24</strong>
          </article>
          <article class="stat">
            <div>待评审</div>
            <strong>07</strong>
          </article>
        </section>

        <section class="card">
          <h3>最近页面</h3>
          <table class="table">
            <thead>
              <tr>
                <th>页面</th>
                <th>负责人</th>
                <th>状态</th>
                <th>更新时间</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>首页总览</td>
                <td>Ava</td>
                <td>已生成</td>
                <td>2 分钟前</td>
              </tr>
              <tr>
                <td>用户分析</td>
                <td>Noah</td>
                <td>待评审</td>
                <td>15 分钟前</td>
              </tr>
              <tr>
                <td>策略设置</td>
                <td>Mia</td>
                <td>设计中</td>
                <td>1 小时前</td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
  </body>
</html>
